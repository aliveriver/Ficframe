name: Build release packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v; must match the project and CHANGELOG.md
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate versions and extract changelog
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_notes.py --version "$REQUESTED_VERSION" \
            --output release-notes.md --github-output "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate release branch and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be started from main, not $GITHUB_REF"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::$RELEASE_TAG already exists. Choose a new version."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            artifact: windows-x64
            package_pattern: windows-x64-*
            binary: build/package/windows/dist/FicFrame/FicFrame.exe
          - platform: linux
            runner: ubuntu-22.04
            artifact: linux-x86_64
            package_pattern: linux-x86_64.*
            binary: build/package/linux/dist/FicFrame/FicFrame
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/build/package/${{ matrix.platform }}/.venv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build/package/${{ matrix.platform }}/python
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/build/package/${{ matrix.platform }}/pyinstaller-cache
      PYTHONUTF8: "1"
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use official PyPI on GitHub runner
        shell: python
        run: |
          from pathlib import Path
          lock = Path("uv.lock")
          text = lock.read_text(encoding="utf-8")
          text = text.replace("https://pypi.tuna.tsinghua.edu.cn/simple", "https://pypi.org/simple")
          text = text.replace("https://pypi.tuna.tsinghua.edu.cn/packages", "https://files.pythonhosted.org/packages")
          lock.write_text(text, encoding="utf-8")
      - name: Check lockfile
        run: uv lock --check
      - name: Build Windows packages
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Version $env:RELEASE_VERSION -RequireInstaller
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/build_linux.sh "$RELEASE_VERSION"
      - name: Check backend
        run: uv run --locked --extra build python -m unittest discover -s tests
      - name: Check frontend
        shell: bash
        run: node --test tests/frontend/*.js tests/test_storyboard_workspace.js
      - name: Smoke test packaged executable
        shell: bash
        env:
          APP_BINARY: ${{ matrix.binary }}
        run: '"$APP_BINARY" --help'
      - uses: actions/upload-artifact@v4
        with:
          name: FicFrame-${{ matrix.artifact }}
          path: release/FicFrame-${{ needs.prepare.outputs.version }}-${{ matrix.package_pattern }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FicFrame-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .
      - name: Verify all packages and generate checksums
        shell: bash
        run: |
          cd artifacts
          packages=(
            "FicFrame-$RELEASE_VERSION-windows-x64-setup.exe"
            "FicFrame-$RELEASE_VERSION-windows-x64-portable.zip"
            "FicFrame-$RELEASE_VERSION-linux-x86_64.run"
            "FicFrame-$RELEASE_VERSION-linux-x86_64.tar.gz"
          )
          for package in "${packages[@]}"; do
            if [[ ! -s "$package" ]]; then
              echo "::error::Missing or empty release package: $package"
              exit 1
            fi
          done
          sha256sum "${packages[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: FicFrame ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            artifacts/FicFrame-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe
            artifacts/FicFrame-${{ needs.prepare.outputs.version }}-windows-x64-portable.zip
            artifacts/FicFrame-${{ needs.prepare.outputs.version }}-linux-x86_64.run
            artifacts/FicFrame-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' }}
